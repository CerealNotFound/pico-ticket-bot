[project]
name = "pico"
version = "0.1.0"
description = "Pumble → Claude → Notion ticket bot"
readme = "README.md"
authors = [
    { name = "cerealnotfound" }
]
requires-python = ">=3.13"
dependencies = [
    "anthropic>=1.11.0",
    "httpx>=0.28.1",
    "notion-client>=3.1",
    "pydantic>=2",
    "python-dotenv>=1.2.4",
    "websockets>=17.2",
]

[project.scripts]
pico = "pico:main"

[build-system]
requires = ["uv_build>=0.11.26,<0.12.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 120
